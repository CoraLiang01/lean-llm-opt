# =============================================================================
# exp_config.yaml  --  single source of truth for every LEAN-LLM-OPT experiment
# =============================================================================
# Every number the reviewers asked us to disclose lives here and here only:
# model versions, decoding parameters, retrieval settings, agent limits,
# retry policy, solver limits, and the price table used for cost accounting.
#
# The file is hashed (sha256) into every run log, so a run can always be tied
# back to the exact settings that produced it.
#
# Paths below are relative to this file, i.e. the repository root. Notebooks
# are launched from the repository root, so they resolve as-is.
# -----------------------------------------------------------------------------

common:
  # ---- reproducibility ------------------------------------------------------
  seed: 20250101
  n_repeats: 3                      # >1 -> report mean +/- std, not a single run
  max_retries: 3
  retry_backoff_s: 5.0
  sleep_between_instances_s: 0.0    # replaces the ad-hoc time.sleep(15)
  solver_time_limit_s: 300.0
  # Hard spending cap per run. Checked after every instance, so the overshoot
  # is at most one instance. Set to 0 to disable. A full 101-instance
  # Large-Scale-OR run measured ~$3.2, so $10 leaves headroom without letting
  # a runaway loop empty the account.
  budget_usd_per_run: 30.0   # raised 2026-08-03: two full A/B runs at higher limits

  # ---- retrieval ------------------------------------------------------------
  # These are the values the notebooks ACTUALLY use, transcribed call site by
  # call site. k is load-bearing here (k=1000 pulls a whole table into context,
  # k=1 is a single-row lookup), so nothing is normalised to a common value --
  # the point is that the settings are now disclosed in one place rather than
  # buried in 20 cells. If you decide to unify any of them, change it here and
  # re-run; the config hash in the run id will change accordingly.
  retriever_search_type: similarity
  retriever_max_tokens_limit: null
  retriever_k:
    default: 5

  retrievers:
    # -- classification over RefData.csv ------------------------------------
    refdata:              {k: 5}
    # -- Large-Scale-OR, GPT-4.1 notebook -----------------------------------
    examples_nrm:         {k: 1}      # cell 7,  few-shot exemplar retrieval
    data_nrm:             {k: 1000}   # cell 7,  row retrieval from user CSV
    examples_ra:          {k: 3}      # cell 9
    data_ra:              {k: 220}    # cell 9
    examples_tp:          {k: 3}      # cell 11
    data_tp:              {k: 300}    # cell 11
    examples_ap:          {k: 1, max_tokens_limit: 400}   # cell 13
    data_ap:              {k: 1, max_tokens_limit: 400}   # cell 13
    examples_flp:         {k: 1, max_tokens_limit: 400}   # cell 15
    data_flp:             {k: 1, max_tokens_limit: 400}   # cell 15
    examples_others:      {k: 1}      # cell 17, retrieve_examples() default
    examples_others_nocsv: {k: 5}     # cell 19
    # -- Large-Scale-OR, gpt-oss-20b notebook -------------------------------
    oss_refdata:          {k: 5}      # cell 6,  retrieve_ref_examples default
    oss_examples:         {k: 1}      # cell 6,  retrieve_examples default
    oss_data_nrm:         {k: 300}    # cell 10
    oss_data_ra:          {k: 400}    # cell 12
    oss_data_ap:          {k: 400}    # cell 14
    oss_data_flp:         {k: 400}    # cell 16
    oss_examples_nocsv:   {k: 5}      # cell 22
    # -- Air-NRM small_scale (both notebooks + both ablations) --------------
    # 38 flight documents and 4 demand documents, so the default fetch_k of 20
    # covers most of the corpus and the post-search filter behaves as if exact.
    air_flight:           {k: 1}      # filtered by OD + departure time
    air_demand:           {k: 1}      # OD-level demand lookup
    air_examples:         {k: 1}      # SBLP exemplar retrieval
    # -- Air-NRM large_scale ------------------------------------------------
    # 1072 flight documents and 90 demand documents. Two changes are needed and
    # both affect results, so both live here rather than in the notebook:
    #
    #   fetch_k  langchain filters AFTER the nearest-neighbour search. At the
    #            default 20 the filter sees an arbitrary window of a 1072-row
    #            corpus: the first live run pulled Eco_lite's fare where
    #            Eco_standard was asked for, and elsewhere got nothing back.
    #            Set to the corpus size so the filter is exact. build_retriever
    #            raises if this is ever smaller than the store.
    #   k        4, one per fare family, so a single call returns all of a
    #            flight's rows and the product is claimed by name. The four
    #            page_contents differ by one word; Eco_standard and Eco_value
    #            are not something cosine distance should adjudicate.
    air_flight_ls:        {k: 4, fetch_k: 1072}
    air_demand_ls:        {k: 1, fetch_k: 90}

  # ---- classification -------------------------------------------------------
  # Which RefData columns the classifier retrieves over. The original code used
  # CSVLoader, which put every column into every document -- including `Label`
  # (the complete mathematical model) and `Label_Code`. With k=5 and
  # chain_type="stuff" that pasted five full formulations into the prompt just
  # to decide the problem class, which they say nothing about.
  classification:
    refdata_file: Large_Scale_Or_Files/RefData.csv
    # Data_address is kept because the file names themselves carry a strong
    # signal about the problem class (supply_capacity.csv + transportation_
    # costs.csv reads as a transportation problem). `Label` and `Label_Code`
    # stay out: they are the largest columns and say nothing about the class.
    refdata_columns: [prompt, Data_address, Label, Label_Code, Related, New Problem Type]
    label_column: New Problem Type

    # ---- LOTO (Leave-One-Type-Out) ------------------------------------------
    # Set to a problem type name (must match RefData's "New Problem Type" column)
    # to remove that type from: (1) Ref-Data retrieval corpus, (2) classifier
    # candidate list, (3) few-shot demo, (4) routing table.
    # null = no holdout, normal operation.
    holdout_type: null

    # Classifier candidate types. Cell 4's prefix and few-shot examples read
    # from this list so there is a single source of truth. When holdout_type
    # is set, the holdout is automatically removed at runtime.
    candidate_types:
      - Network Revenue Management
      - Resource Allocation
      - Transportation Problem
      - Facility Location Problem
      - Assignment Problem
      - Mixture
      - SBLP
      - Others with CSV
      - Others without CSV

    # Bump this whenever the classifier's *prompt* changes. It has no effect on
    # behaviour; it exists only so the change reaches config_hash() and hence
    # the run_id. Without it, runs made before and after a prompt edit are
    # indistinguishable in the logs -- same hash, different model input --
    # and aggregate_runs.py silently pools them as one configuration.
    #   2026-08-03  the candidate-type list was wrong in all three places it
    #               appeared: `prefix` omitted Assignment Problem and Mixture,
    #               one few-shot example had an empty slot where `Others with
    #               CSV` belonged, and no copy mentioned Mixture at all. Since
    #               a class the prompt never names is a class the agent cannot
    #               answer, Mixture was predicted 0/18 across two full runs.
    prompt_revision: '2026-08-18'

    # ---- comparing predicted class against ground truth ---------------------
    # Three vocabularies are in play and none of them match:
    #   gold_type   Large-scale-or-101.csv:Problem Type -> NRM, RA, TP, AP,
    #               UFLP, Mixture, "Others -Traveling Salesman Problem", ...
    #   RefData     New Problem Type -> full names, plus Mixture and Others
    #   pred_type   whatever extract_problem_type()'s regex found in the
    #               agent's answer -> "Network Revenue Management", ...
    # Comparing the raw strings gave a classification accuracy of 0.0%, which
    # is not a result, it is a vocabulary mismatch: UFLP/TP/AP were in fact
    # classified correctly on 28 of 28 instances.
    type_aliases:
      NRM:   [NRM, Network Revenue Management, Network Revenue Management Problem]
      RA:    [RA, Resource Allocation, Resource Allocation Problem]
      TP:    [TP, Transportation, Transportation Problem]
      AP:    [AP, Assignment Problem]
      UFLP:  [UFLP, FLP, Facility Location Problem,
              Uncapacited Facility Location Problem, Uncapacited Facility Location]
      SBLP:  [SBLP, Sales-Based Linear Programming,
              Sales-Based Linear Programming-CA, Sales-Based Linear Programming-Flow]
      Mixture: [Mixture]
      Others: [Others, Others with CSV, Others without CSV]

    # A gold label of "Others -Knapsack" is treated as Others: the pipeline has
    # a single Others branch and no knapsack branch, so the sub-type cannot be
    # predicted. Set to false to require an exact match instead; the report
    # prints both numbers either way.
    others_prefix_counts_as_others: true

    # Gold classes the classifier cannot express, excluded from the accuracy
    # denominator and reported separately rather than scored as wrong.
    #
    # Empty since 2026-08-03. Mixture used to be here: RefData labels 18 rows
    # Mixture, but extract_problem_type()'s regex had no such alternative, so
    # "a Mixture of Resource Allocation and Transportation" was recorded as
    # "Resource Allocation" and the hybrid judgement was lost. Scoring those
    # instances would have measured the extractor rather than the classifier.
    #
    # The regex now includes Mixture and the router has an explicit branch, so
    # the class is observable and scored like any other. Note the branch still
    # runs the generic CSV workflow -- there is no Mixture-specific solver.
    # "Classified correctly" and "handled well" remain separate questions.
    types_without_branch: []

  # ---- agent ----------------------------------------------------------------
  agent_type: ZERO_SHOT_REACT_DESCRIPTION
  # Originally unbounded in the 4.1 notebooks and 5 in the oss ones; unified to
  # 5, then raised to 10 on 2026-08-02.
  #
  # At 5, Abl-FewShotOnly returned "Agent stopped due to iteration limit or
  # time limit" on 10 of 15 Air-NRM instances and scored 0%. The other two
  # arms hit the limit zero times. That is not a fair ablation: removing
  # retrieval forces the agent to fetch data through repeated tool calls
  # (5.3 per instance, against 2.5-2.8 for the arms that retrieve), so the
  # same cap binds hardest on the arm being ablated. A 0% that the budget
  # produced is not evidence that the component matters.
  #
  # The cap still exists to stop a ReAct loop from burning tokens forever --
  # it just has to be loose enough that every arm can finish.
  # 2026-08-03: raised again to 40 / 900s for the refdata A/B. The point of
  # that comparison is what the retrieved context does to accuracy, so neither
  # arm should be stopped by a budget instead of by finishing. These are
  # runaway guards, not experimental parameters -- they only need to be low
  # enough to catch a ReAct loop that will never terminate.
  agent_max_iterations: 40
  agent_max_execution_time: 900.0
  agent_early_stopping_method: force
  handle_parsing_errors: true
  verbose: false

  # ---- logging --------------------------------------------------------------
  out_dir: runs
  log_prompts: true                 # referee 1 Q4: "report exact prompts"
  log_raw_responses: true
  token_fallback_encoder: o200k_base

  # ---- hardware (for local-model runs; copied verbatim into config.json) ----
  hardware_note: "FILL IN for local-model runs: GPU model, driver/CUDA, Ollama version, quantisation -- e.g. 1x NVIDIA A100 80GB, CUDA 12.4, Ollama 0.12.3, gpt-oss:20b MXFP4. This line is quoted in the paper's experimental setup; a run whose hardware is unrecorded cannot be reported as a wall-clock or cost result."

# =============================================================================
# Model profiles.  One profile == one row in the cost/accuracy comparison table.
# `defaults` applies to all roles; a role block overrides it.
# Roles: classifier | modeler | data_agent | coder
# PRICES: USD per 1,000,000 tokens. Checked 2026-07-24; re-verify before the
# camera-ready run and cite the date in the paper.
# =============================================================================

model_profiles:

  # ---------------------------------------------------------------- GPT-4.1 --
  gpt-4.1:
    embedding_provider: openai
    embedding_model: text-embedding-3-small
    embedding_price_per_1m: 0.02         # checked 2026-07-24
    defaults:
      provider: openai
      model: gpt-4.1-2025-04-14     # pin the dated snapshot, not the alias
      temperature: 0.0
      top_p: 1.0
      n: 1
      seed: 20250101
      # Raised from 8192 on 2026-08-02. Instance 94 of Large-Scale-OR emitted
      # exactly 8192 completion tokens in the codegen stage and failed with
      # "SyntaxError: '[' was never closed" -- the model was inlining a long
      # data literal and the output was cut mid-list. That scored as a wrong
      # answer, but nothing was wrong with the formulation; the budget was.
      # A truncated generation is indistinguishable from a bad one in the
      # results table, so the limit should sit well clear of what the task
      # needs. gpt-4.1 allows 32768; 16384 leaves headroom without inviting
      # runaway generations.
      max_tokens: 32768
      price_in_per_1m: 2.00
      price_cached_in_per_1m: 0.50
      price_out_per_1m: 8.00
    roles:
      classifier: {}                # NOTE: was gpt-4 in the old notebooks
      modeler: {}
      data_agent: {}
      coder: {}

  # --------------------------------------- GPT-4.1 via the OpenRouter gateway -
  # Same model, different billing account. Useful when the group's OpenAI
  # project has no quota. OpenRouter is OpenAI-API-compatible, so only base_url,
  # the model slug and the key variable change -- no code differences.
  # Per-token list price matches OpenAI direct ($2 / $8 per 1M); OpenRouter
  # takes its margin on credit top-ups, not per token, so the logged cost is
  # the model cost. Note that in the paper this is still "GPT-4.1", but the
  # serving route should be disclosed: OpenRouter may dispatch to different
  # upstream hosts, so outputs are not guaranteed bit-identical to OpenAI direct.
  openrouter-gpt-4.1:
    embedding_provider: openai
    embedding_model: openai/text-embedding-3-small
    embedding_base_url: https://openrouter.ai/api/v1
    embedding_api_key_env: OPENROUTER_API_KEY
    embedding_price_per_1m: 0.02
    defaults:
      provider: openai
      model: openai/gpt-4.1
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      top_p: 1.0
      n: 1
      seed: null                    # some upstream hosts reject `seed`
      max_tokens: 8192
      price_in_per_1m: 2.00
      price_cached_in_per_1m: 0.50
      price_out_per_1m: 8.00
    roles:
      classifier: {}
      modeler: {}
      data_agent: {}
      coder: {}

  # ------------------------------------------------------------ gpt-oss-20b --
  # Local open-weights model through Ollama. This is the profile the paper's
  # LEAN (gpt-oss-20B) numbers come from.
  gpt-oss-20b:
    # Retrieval is local too, so the whole arm runs without an API key of any
    # kind -- which is the point: the machine that hosts the model needs no
    # credential, no outbound network, and nothing shared with it.
    #
    # The trade-off is on the record: the gpt-4.1 profile embeds with OpenAI's
    # text-embedding-3-small, so the two arms retrieve from different vector
    # spaces and the gap between their accuracies is "different model AND
    # different retrieved examples", not model alone. Report the gpt-oss arm's
    # retrieval component explicitly rather than implying it is shared. To make
    # the two arms strictly comparable instead, set embedding_provider: openai
    # / text-embedding-3-small here and supply OPENAI_API_KEY.
    embedding_provider: ollama
    embedding_model: nomic-embed-text
    embedding_base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    embedding_price_per_1m: 0.0          # local server
    defaults:
      provider: ollama
      model: gpt-oss:20b
      temperature: 0.0
      top_p: 1.0
      seed: 20250101
      # Raised from 8192 on 2026-08-20 for the same reason as gpt-4.1 (see the
      # note there) plus one more: gpt-oss spends completion tokens on its
      # reasoning channel before it writes any code, so 8192 is even tighter
      # here than it was for a non-reasoning model. Kept equal to the
      # openrouter-gpt-oss-20b profile so the two routes stay comparable.
      max_tokens: 32768
      # Resolved at load time by expand_env(); export OLLAMA_BASE_URL to point
      # the run at a server that listens somewhere else, without editing this
      # file (an edit here would also move config_sha256).
      base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
      # Local inference: monetary price 0; we report GPU wall-clock instead.
      price_in_per_1m: 0.0
      price_out_per_1m: 0.0
      extra:
        # ---- num_ctx: the expensive one ----------------------------------
        # Ollama takes its context window from the model's Modelfile and the
        # common default is 4096. The prompts here average ~19k tokens
        # (mean_prompt_tokens = 19221 across the GPT-4.1 runs). When the window
        # is too small Ollama does not error -- it drops the front of the
        # prompt. The retrieved examples and the pasted data tables are exactly
        # what sits at the front, so the model answers from a stump and the
        # results table reads "gpt-oss is weak" when the truth is "gpt-oss was
        # shown a third of the question". Pin it well clear of the need.
        num_ctx: 65536
        # A 13 GB model is unloaded after 5 idle minutes by default. One run is
        # ~700 calls; a single pause long enough to trigger a reload costs more
        # wall-clock than the instance that caused it.
        keep_alive: 30m
        # Return the chain-of-thought in its own field instead of inside
        # `content`. This is not cosmetic: classify_problem() compares the
        # reply to ALLOWED_CATS with `in`, so reasoning text prepended to the
        # answer fails every comparison and collapses all 101 instances to the
        # "Others with CSV" fallback -- a plausible-looking table that measures
        # nothing. If the local Ollama build rejects `think`, set this to null
        # and expect to need a parser that strips the reasoning instead.
        reasoning: true
    roles:
      classifier: {}
      modeler: {}
      data_agent: {}
      coder: {}

  # --------------------------- gpt-oss-20b via the OpenRouter gateway --------
  # Same open-weights model, served remotely. The `gpt-oss-20b` profile above
  # needs ~13 GB of RAM/VRAM for the MXFP4 weights, which no machine in the
  # group currently has; OpenRouter is OpenAI-API-compatible, so only base_url,
  # the model slug and the key variable change -- no code differences.
  #
  # Serving route must be disclosed in the paper: OpenRouter dispatches to
  # several upstream hosts that quantise the model differently (fp4 / fp8 /
  # bf16), so `provider.only` pins one host. DeepInfra serves bf16 -- the
  # unquantised reference weights, the one route whose numbers are not
  # confounded by quantisation -- and accepts `seed`.
  #
  # Embeddings deliberately go to OpenAI direct, exactly as in the `gpt-4.1`
  # profile: retrieval must be identical across profiles or the model
  # comparison also measures a change of embedding space.
  openrouter-gpt-oss-20b:
    # Same embeddings as the `gpt-oss-20b` profile above, on purpose: a
    # fallback that retrieves differently from the route it is standing in for
    # is not a fallback, it is a third arm. nomic-embed-text is 274 MB and runs
    # on anything, so a machine that cannot host the 20B model can still serve
    # it. If Ollama is unavailable entirely, switch these three lines to
    # openai / text-embedding-3-small and record that those runs used a
    # different retrieval component than the rest of the gpt-oss arm.
    embedding_provider: ollama
    embedding_model: nomic-embed-text
    embedding_base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    embedding_price_per_1m: 0.0
    defaults:
      provider: openai                   # OpenAI-compatible gateway
      model: openai/gpt-oss-20b
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      top_p: 1.0
      n: 1
      seed: 20250101                     # honoured by DeepInfra
      # gpt-oss emits chain-of-thought before the answer and those reasoning
      # tokens are billed as completion tokens, so the budget has to cover both.
      # gpt-4.1 needed 32768 after instance 94 was cut mid-list at 8192; a
      # reasoning model needs at least as much. Context window is 131072.
      max_tokens: 32768
      # USD per 1M tokens, DeepInfra route, checked 2026-08-20 against
      # https://openrouter.ai/api/v1/models/openai/gpt-oss-20b/endpoints
      price_in_per_1m: 0.03
      price_out_per_1m: 0.14
      extra:
        extra_body:
          provider:
            only: [deepinfra]
            allow_fallbacks: false       # fail loudly rather than silently
          # gpt-oss's reasoning budget. Pinned so it is part of the logged
          # config instead of an upstream default that can change.
          reasoning:
            effort: medium
    roles:
      classifier: {}
      modeler: {}
      data_agent: {}
      coder: {}

  # ------------------------------- smoke-test profile: small local model -----
  # NOT for paper results. A 3B model is too weak to formulate these problems,
  # but it is enough to check that routing, logging, token accounting and the
  # aggregation tables all work end to end without spending anything.
  #   ollama pull llama3.2:3b && ollama pull nomic-embed-text
  ollama-small:
    embedding_provider: ollama
    embedding_model: nomic-embed-text
    embedding_base_url: http://localhost:11434
    embedding_price_per_1m: 0.0          # local server
    defaults:
      provider: ollama
      model: llama3.2:3b
      temperature: 0.0
      top_p: 1.0
      seed: 20250101
      max_tokens: 2048
      base_url: http://localhost:11434
      price_in_per_1m: 0.0
      price_out_per_1m: 0.0
    roles:
      classifier: {}
      modeler: {}
      data_agent: {}
      coder: {}

  # ------------------------------------------- single-call baseline: GPT-5.2 --
  gpt-5.2:
    embedding_provider: openai
    embedding_model: text-embedding-3-small
    embedding_price_per_1m: 0.02         # checked 2026-07-24
    defaults:
      provider: openai
      model: gpt-5.2
      # NOTE: the old Benchmark_Base_Model_Small_Scale.ipynb ran GPT-5 at
      # temperature=1.0 while every other model ran at 0.0. Keep 0.0 unless the
      # endpoint rejects it; if it does, record the deviation in `notes`.
      temperature: 0.0
      top_p: 1.0
      max_tokens: 16384
      price_in_per_1m: 0.88
      price_cached_in_per_1m: 0.088
      price_out_per_1m: 7.00
    roles:
      modeler: {}
      coder: {}

  # -------------------------------------- single-call baseline: Gemini 3 Pro --
  gemini-3-pro:
    embedding_provider: openai      # keep retrieval identical across profiles
    embedding_model: text-embedding-3-small
    defaults:
      provider: google
      model: gemini-3-pro
      temperature: 0.0
      top_p: 1.0
      max_tokens: 16384
      # <=200K-token prompts; the long-context tier is ~2x and must be flagged
      # if any instance exceeds 200K tokens
      price_in_per_1m: 2.00
      price_out_per_1m: 12.00
    roles:
      modeler: {}
      coder: {}

# =============================================================================
# Methods (pipeline variants). `method` is a free-form string passed to
# load_config(); listed here so the ablation grid is documented in one place.
# The notebook column says which file currently implements each variant.
# =============================================================================
methods:
  LEAN-LLM-OPT:
    desc: full pipeline (classification + type-tailored workflow + data tools)
    notebooks:
      - LEAN_LLM_OPT_4.1_Large-scale-or.ipynb
      - LEAN_LLM_OPT_4.1_Air_NRM.ipynb
      - LEAN_LLM_OPT_gpt_oss_20b_Large-scale-or.ipynb
      - LEAN_LLM_OPT_gpt_oss_20b_Air_NRM.ipynb
  Abl-RAGOnly:
    desc: retrieval only, no type-tailored workflow
    notebooks: [Ablation_Study_Air_NRM_RAG_Only.ipynb]
  Abl-FewShotOnly:
    desc: static few-shot exemplars, no retrieval, no workflow
    notebooks: [Ablation_Study_Air_NRM_Few-shot_Only.ipynb]
  Base-SingleCall:
    desc: one prompt, one call, dataset schema pasted in
    notebooks: [Benchmark_Base_Model_Small_Scale.ipynb]
  # --- still to be implemented (referee 1 Q3/Q4, referee 2 Q5) --------------
  Abl-NoWorkflow:      {desc: LLM + data tools, no type-tailored workflow}
  Abl-NoDataTools:     {desc: LLM + retrieved examples, no CSVQA / FileQA tools}
  Abl-PandasOnly:      {desc: LLM + raw pandas access, no retrieval, no workflow}
  Abl-OracleType:      {desc: ground-truth problem type injected (bypasses classifier)}
  Abl-WrongRouting:    {desc: deliberately routed to an incorrect workflow}
  Base-OptiMUS:        {desc: OptiMUS as published, run on our benchmark}
  Base-OptiMUS-native: {desc: OptiMUS on NLP4LP (its intended setting)}

# =============================================================================
# Datasets -- verified against the repository on 2026-07-24
# =============================================================================
datasets:
  Large-Scale-OR: Test_Dataset/Large-scale-or/Large-scale-or-101.csv
  # Air-NRM has two cases under Test_Dataset/Air_NRM/, both built from
  # Singapore Airlines data: small_scale/ is the 3-airport toy instance the
  # notebooks currently run; large_scale/ is the SQ direct 2-city real-data
  # build (90 ODs / 268 departures). See Test_Dataset/Air_NRM/README.md.
  Air-NRM-CA:     Test_Dataset/Air_NRM/small_scale/query_CA.csv
  Air-NRM-NP:     Test_Dataset/Air_NRM/small_scale/query_NP_Flow.csv
  Air-NRM-CA-LS:  Test_Dataset/Air_NRM/large_scale/query_CA.csv
  NL4OPT:         Test_Dataset/Small-scale/NL4OPT NEW.csv
  IndustryOR:     Test_Dataset/Small-scale/IndustryOR_fixedV2.csv
  MAMO-easy:      Test_Dataset/Small-scale/MAMO_EasyLP_fixed.csv
  MAMO-complex:   Test_Dataset/Small-scale/MAMO_ComplexLP_fixed.csv
  # not yet in the repo -- referee 2 Q1 asks for these two
  ComplexOR:      null
  OptiBench:      null

# =============================================================================
# Dataset column mapping
# =============================================================================
# The benchmark CSVs came from different sources and name the same things
# differently -- Large-Scale-OR calls the ground-truth optimum
# `Label-objective`, every small-scale set calls it `Label`. Hard-coding one
# name means the other datasets score as "no ground truth available", which
# looks like a modelling failure and is really a column-name mismatch.
#
# `candidates` is tried in order against the CSV's actual columns; the first
# match wins. `overrides` pins a specific dataset when the generic search would
# guess wrong. A field that matches nothing is simply absent -- that is a real
# answer for e.g. Air-NRM, which ships no ground-truth objective.
dataset_columns:
  candidates:
    query:            [Query, query, question, Question, problem, Problem]
    gold_objective:   [Label-objective, Label, label, objective, Objective,
                       answer, Answer, optimal_value]
    gold_type:        [Problem Type, problem_type, Type, type]
    dataset_address:  [Dataset_address, dataset_address, data_files, Data_address]
    size_class:       [Type by size, size_class, size]

  overrides:
    # MAMO ships `original_answer` AND a misspelled `orginal_answer`, both
    # empty in the current files. `Label` is the column actually populated;
    # name it explicitly so neither empty column can win by accident.
    MAMO-easy:      {gold_objective: Label}
    MAMO-complex:   {gold_objective: Label}
    # Air-NRM small_scale carries ground truth again as of 2026-07-31: the
    # objectives were always in SBLP_*_Label/, but the query files did not
    # expose them, so nothing could score this dataset. link_air_nrm_labels.py
    # copies them across as `Label-objective` after verifying row alignment;
    # the generic candidate list picks that up, so no override is needed.
    #
    # large_scale needs no override either, as of build_largescale_labels.py +
    # link_air_nrm_labels.py: the former solves each instance into
    # large_scale/SBLP_CA_Label/CA_answer.csv, the latter copies Obj_label
    # across as `Label-objective`, which the generic candidate list resolves.
    #
    # Only the objective is copied. The expanded model is not in any CSV: it
    # is the .lp text, which belongs in SBLP_CA_Label/<n>.lp and nowhere else.

# Reference / RAG corpora (read by the classification and few-shot agents)
reference_files:
  refdata:          Large_Scale_Or_Files/RefData.csv
  examples_NRM:     Large_Scale_Or_Files/RAG_Example_NRM2_MD.csv
  examples_RA:      Large_Scale_Or_Files/RAG_Example_RA2_MD.csv
  examples_TP:      Large_Scale_Or_Files/RAG_Example_TP2_MD.csv
  examples_AP:      Large_Scale_Or_Files/RAG_Example_AP2_MD.csv
  examples_FLP:     Large_Scale_Or_Files/RAG_Example_FLP2_MD.csv
  examples_Others:  Large_Scale_Or_Files/RAG_Example_Others.csv
  examples_OthersNoCSV: Large_Scale_Or_Files/RAG_Example_Others_Without_CSV.csv
  examples_SBLP_CA:   Large_Scale_Or_Files/RAG_Example_SBLP_CA.csv
  examples_SBLP_Flow: Large_Scale_Or_Files/RAG_Example_SBLP_Flow.csv
